services:
  kataster:
    image: registry-mcp.aittorney.online/kataster@sha256:1ac7c83bb31773d114d2b2be94427b7d604ca339be316a5ec0395627b4cd4269
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    environment:
      SK_KATASTER_ORIGIN: https://mcp-kataster.aittorney.online
      SK_KATASTER_TOKENS: ${SK_KATASTER_TOKENS:?Configure per-user token hashes in Dokploy}
      SK_KATASTER_AUTH_ISSUER: ${SK_KATASTER_AUTH_ISSUER:-}
      SK_KATASTER_AUTH_SECRET: ${SK_KATASTER_AUTH_SECRET:-}
      SOURCE_REVISION: "538935969eb56e63d1f12fc59b0f66d9709b0e00"
    volumes:
      - kataster-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Host':'mcp-kataster.aittorney.online'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [dokploy-network]
volumes:
  kataster-data:
networks:
  dokploy-network:
    external: true
