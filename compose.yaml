services:
  kataster:
    image: registry-mcp.aittorney.online/kataster@sha256:e0b874011a3a2dc633ea1ff3a24fc8727f9efb3bb16dcfd1cc8ee0f90257810f
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    environment:
      SK_KATASTER_ORIGIN: https://mcp-kataster.aittorney.online
      SK_KATASTER_TOKENS: ${SK_KATASTER_TOKENS:?Configure per-user token hashes in Dokploy}
      SK_KATASTER_AUTH_ISSUER: ${SK_KATASTER_AUTH_ISSUER:-}
      SK_KATASTER_AUTH_SECRET: ${SK_KATASTER_AUTH_SECRET:-}
      SOURCE_REVISION: "f9055f1db1d1a0ced062825c2f61e0bb5914bf9a"
    volumes:
      - kataster-data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Host':'mcp-kataster.aittorney.online'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [dokploy-network]
volumes:
  kataster-data:
networks:
  dokploy-network:
    external: true
