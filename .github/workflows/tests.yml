name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # offline only: pyproject addopts deselect tests marked "live" (real endpoints, human pace)
      - run: uv run --frozen pytest
      - run: uv build
      - name: CLI outside checkout
        run: uv run --frozen python -c "import os, subprocess, sys, tempfile; os.chdir(tempfile.gettempdir()); subprocess.run([sys.executable, '-m', 'kataster_mcp.cli', '--json', 'doctor'], check=True)"
